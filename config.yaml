# UPL Door Jingle System Configuration

# Time-of-Flight Sensor Settings
tof:
  # Distance threshold in mm - closer than this triggers detection
  distance_threshold: 1500

  # Debounce time in seconds - wait this long to confirm exit
  debounce_time: 2.0

  # Polling interval in seconds
  poll_interval: 0.1

# BLE Detective Settings
ble:
  # Number of recent RSSI readings to track for spike detection
  rssi_window_size: 10

  # RSSI increase (dBm) to consider an "entry spike"
  # Higher = more sensitive (detects farther away)
  # Lower = less sensitive (must be closer)
  spike_threshold: 15

  # Cooldown in seconds before same device can trigger another entry
  entry_cooldown: 300

# Audio Settings
audio:
  # Directory with default jingles (for unidentified entries)
  default_sounds_dir: ./sounds/default

  # Directory with custom user jingles
  custom_sounds_dir: ./sounds/custom

# System Settings
system:
  # Seconds to wait for BLE identification before playing default sound
  identification_timeout: 3.0
